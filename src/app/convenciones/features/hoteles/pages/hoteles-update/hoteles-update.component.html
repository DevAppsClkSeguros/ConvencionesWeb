@if (hotelResource?.error()) {
<shared-not-found mensaje="{{hotelResource?.error()}}" />
}
@if (!hotelResource?.error()) {
<div class="min-h-screen flex items-center justify-center bg-base-200 p-5">
  <form [formGroup]="myForm" (ngSubmit)="onSubmit()" class="bg-base-100 p-8 rounded-2xl shadow-lg w-full max-w-4xl">
    <h2 class="text-3xl font-bold mb-6">Datos del Hotel</h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      @if (isEditMode) {
      <div>
        <label class="label">ID</label>
        <input type="text" formControlName="id" class="input input-bordered w-full" readonly />
      </div>
      <div></div>
      }

      <!-- Nombre -->
      <div>
        <label class="label">Hotel</label>
        <input type="text" formControlName="nombreHotel" class="input input-bordered w-full" />
        <shared-form-error-label [control]="myForm.get('nombreHotel')!"></shared-form-error-label>
      </div>

      <!-- Dirección -->
      <div>
        <label class="label">Dirección</label>
        <input type="text" formControlName="direccion" class="input input-bordered w-full" />
        <shared-form-error-label [control]="myForm.get('direccion')!"></shared-form-error-label>
      </div>

      <!-- Latitud -->
      <div>
        <label class="label">Latitud</label>
        <input type="number" formControlName="latitud" class="input input-bordered w-full" />
        <shared-form-error-label [control]="myForm.get('latitud')!"></shared-form-error-label>
      </div>

      <!-- Longitud -->
      <div>
        <label class="label">Longitud</label>
        <input type="number" formControlName="longitud" class="input input-bordered w-full" />
        <shared-form-error-label [control]="myForm.get('longitud')!"></shared-form-error-label>
      </div>

      <!-- Teléfono -->
      <div>
        <label class="label">Telefono</label>
        <input type="number" formControlName="telefono" class="input input-bordered w-full" />
        <shared-form-error-label [control]="myForm.get('telefono')!"></shared-form-error-label>
      </div>

      <!-- Convención -->
      <div>
        <label class="label">Convención</label>
        <select formControlName="eventoId" class="select select-bordered w-full">
          <option value="" selected>Selecciona una convención</option>
          @for (convencion of convencionesResource.value(); track convencion.id) {
          <option [value]="convencion.id">{{convencion.nombreEvento}}</option>
          }
        </select>
        <shared-form-error-label [control]="myForm.get('eventoId')!"></shared-form-error-label>
      </div>

      <div class="md:col-span-2">
        <label class="label">Detalles</label>
        <textarea class="textarea w-full min-h-[150px]" formControlName="detalles"></textarea>
        <shared-form-error-label [control]="myForm.get('detalles')!"></shared-form-error-label>
      </div>

      <!-- Foto -->
      <div>
        <shared-upload-file [preview]="imagePreview" (imagen)="onFileSelected($event)"></shared-upload-file>
        <shared-form-error-label [control]="myForm.get('imagen')!"></shared-form-error-label>
      </div>

      <shared-convencionistas-por-convencion class="md:col-span-2" [convencionId]="convencionId()"
        (convencionistasSeleccionados2)="seleccionaConvencionista($event)"
        [convencionistasPorVuelo]="myForm.get('convencionistasIds')?.value || []" />
      <shared-form-error-label [control]="myForm.get('convencionistasIds')!"></shared-form-error-label>
    </div>

    <app-mapa-selector (coordenadas)="capturaCoordenadas($event)" [coordenadasDefault]="coordenadasDefault()"/>
    <!-- Botones -->
    <div class="flex justify-end mt-8 gap-4">
      <button type="button" class="btn btn-neutral" (click)="goBack()">Cancelar</button>
      <button type="submit" class="btn btn-primary">Guardar</button>
    </div>
  </form>
</div>
}
