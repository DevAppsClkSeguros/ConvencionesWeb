<div class="flex flex-col gap-4 relative">
  <div class="absolute z-10 left-0 right-0 top-2 flex justify-center mt-12">
    <div class="w-11/12 sm:w-2/3  rounded-2xl">
      <gmp-place-autocomplete #placeAutocomplete placeholder="Buscar lugar..."
        class="flex-1  text-sm outline-none rounded-2xl focus:ring-0">
      </gmp-place-autocomplete>
    </div>
  </div>

  <!-- 🗺️ Mapa -->
  <div class="w-full h-[400px] rounded-2xl overflow-hidden shadow">
    <google-map height="100%" width="100%" [center]="markerPosition() || coordenadasDefault()" [options]="mapOptions"
      (mapClick)="onMapClick($event)">
      <!-- @if (markerPosition()) { -->
      <map-advanced-marker [position]="markerPosition()! || coordenadasDefault()" />
      <!-- } -->
    </google-map>
  </div>
  @if (markerPosition()) {
  <div class="flex flex-col sm:flex-row gap-2 items-center justify-between">
    <div class="text-sm">
      <p class="text-white"><strong>Latitud:</strong> {{ markerPosition()?.lat }}</p>
      <p class="text-white"><strong>Longitud:</strong> {{ markerPosition()?.lng }}</p>
    </div>
  </div>
  }
</div>
