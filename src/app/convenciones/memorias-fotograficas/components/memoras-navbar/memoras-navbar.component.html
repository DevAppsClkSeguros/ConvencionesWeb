<div class="navbar bg-base-100 shadow-sm">
  <div class="navbar-start">
    <div class="dropdown">
      <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" />
        </svg>
      </div>
      <ul tabindex="0" class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow">
        <li><a routerLink="/memorias-fotograficas/fotos" class="btn btn-ghost" routerLinkActive="text-primary">
            Fotos
          </a></li>
        <li><a routerLink="/memorias-fotograficas/videos" class="btn btn-ghost" routerLinkActive="text-primary">
            Videos
          </a></li>
      </ul>
    </div>
    <label class="btn btn-ghost text-xl">Memorias</label>
  </div>
  <div class="navbar-center hidden lg:flex">
    <ul class="menu menu-horizontal px-1">
      <li><a routerLink="/memorias-fotograficas/fotos" [routerLinkActiveOptions]="{ exact: false }"
          class="btn btn-ghost" routerLinkActive="text-primary">
          Fotos
        </a></li>
      <li><a routerLink="/memorias-fotograficas/videos" class="btn btn-ghost" routerLinkActive="text-primary">
          Videos
        </a></li>
    </ul>
  </div>
  <div class="navbar-end">
    <section class="flex flex-col md:flex-row items-center justify-between gap-4 p-4">
      <div class="flex flex-col justify-end items-end w-full sm:w-full">
        <fieldset class="fieldset h-10">
          <select #convencionSelect class="select"
            (change)="multimedia(convencionSelect.value)">
            <option value="" selected>Selecciona una convención </option>
            @for (convencion of convencionesResource.value(); track convencion.id) {
            <option [value]="convencion.nombreEvento">{{convencion.nombreEvento}}</option>
            }
          </select>
        </fieldset>
      </div>
    </section>
  </div>
</div>
