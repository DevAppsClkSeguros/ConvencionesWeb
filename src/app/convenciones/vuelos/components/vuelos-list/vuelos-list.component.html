<div>
  <section class="flex flex-col md:flex-row items-center justify-between gap-4 p-4">
    <span class="text-center md:text-left w-full md:w-auto text-3xl">Vuelos</span>
    <div class="flex flex-col sm:flex-row items-center justify-end gap-4 w-full md:w-auto">
      <a (click)="refrescaDatos()" class="btn btn-info">
        <shared-icon-refresh />
        Refrescar
      </a>
      <a routerLink="/vuelos/new" class="btn btn-primary">
        <shared-icon-add />
        Nuevo
      </a>
    </div>
  </section>
  <div class="overflow-x-auto">
    <table class="table md:ml-5 w-full min-w-full">
      <!-- head -->
      <thead>
        <tr>
          <th>Id</th>
          <th>Vuelo</th>
          <th>Origen</th>
          <th>Destino</th>
          <th>Convención</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <!-- row 1 -->
        @for (vuelo of vuelosResource.value(); track vuelo.id) {
        <tr>
          <td>{{vuelo.id}}</td>
          <td>
            {{vuelo.reservacion}}
            <br />
            <span class="badge badge-ghost badge-sm">{{vuelo.numero_Vuelo}}</span>
          </td>
          <td>
            {{vuelo.origen}}
            <br />
            <span class="badge badge-ghost badge-sm">{{vuelo.hora_Salida}}</span>
          </td>
          <td>
            {{vuelo.destino}}
            <br />
            <span class="badge badge-ghost badge-sm">{{vuelo.hora_Llegada}}</span>
          </td>
          <td>{{vuelo.eventoId}}
          </td>
          <th>
            <button class="btn btn-primary btn-xs" [routerLink]="[`/vuelos/${vuelo.id}/edit`]">Editar</button>
          </th>
          <th>
            <button class="btn btn-secondary btn-xs" (click)="abrirModal(vuelo.id)">Eliminar</button>
          </th>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>

<shared-confirm-modal #deleteModal titulo="¡Confirmar Eliminación!" mensajeAceptar="Si, Eliminar"
  mensaje="{{mensajeEliminar}}" (confirmar)="eliminaVuelo()" (cancelar)="vueloId = 0" />
