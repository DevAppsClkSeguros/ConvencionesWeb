<div>
  <section class="flex flex-col md:flex-row items-center justify-between gap-4 p-4">
    <span class="text-center md:text-left w-full md:w-auto text-3xl">Perfiles</span>
    <div class="flex flex-col sm:flex-row items-center justify-end gap-4 w-full md:w-auto">
      <a (click)="refrescaDatos()" class="btn btn-info">
        <shared-icon-refresh />
        Refrescar
      </a>
      <a routerLink="/convencionistas/perfiles/new" class="btn btn-primary">
        <shared-icon-add />
        Nuevo
      </a>
    </div>
  </section>
  <div class="overflow-x-auto">
    <table class="table ml-5">
      <!-- head -->
      <thead>
        <tr>
          <th>Id</th>
          <th>Perfil</th>
          <th>Estatus</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (perfil of perfilesResource.value(); track perfil.id) {
        <tr>
          <td>{{perfil.id}}</td>
          <td>
            {{perfil.nombre}}
          </td>
          <td>{{perfil.activo ? 'Activo' : 'Inactivo'}}</td>
          <th>
            <button class="btn btn-primary btn-xs"
              [routerLink]="[`/convencionistas/perfiles/${perfil.id}/edit`]">Editar</button>
          </th>
          <th>
            <button class="btn btn-secondary btn-xs" (click)="abrirModal(perfil.id)">Eliminar</button>
          </th>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>

<shared-confirm-modal #deleteModal titulo="¡Confirmar Eliminación!" mensajeAceptar="Si, Eliminar"
  mensaje="{{mensajeEliminar}}" (confirmar)="eliminaPerfil()" (cancelar)="perfilId = 0" />
