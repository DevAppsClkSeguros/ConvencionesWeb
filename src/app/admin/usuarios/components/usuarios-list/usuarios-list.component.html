<div>
  <section class="flex flex-col md:flex-row items-center justify-between gap-4 p-4">
    <span class="text-center md:text-left w-full md:w-auto text-3xl">Usuarios</span>
    <div class="flex flex-col sm:flex-row items-center justify-end gap-4 w-full md:w-auto">
      <a (click)="refrescaDatos()" routerLink="by-country" class="btn btn-info">
        <shared-icon-refresh />
        Refrescar
      </a>
      <a routerLink="/admin/usuarios/new" class="btn btn-primary">
        <shared-icon-add />
        Nuevo
      </a>
    </div>
  </section>
  <div class="overflow-x-auto">
    <table class="table ml-5">
      <!-- head -->
      <thead>
        <tr>
          <th>NicName</th>
          <th>Nombre</th>
          <th>Estatus</th>
          <th>Roles</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (usuario of usuariosResource.value(); track usuario.userName) {
        <tr>
          <td>{{usuario.userName}}</td>
          <td>{{usuario.firstName}} {{usuario.lastName}}
          </td>
          <td> {{usuario.activo ? 'Activo' : 'Inactivo'}} </td>
          <td>
            @for (rol of usuario.roles; track rol) {
            <span class="badge badge-info badge-sm">
              {{rol}}
            </span> <br />
            }
          </td>
          <th>
            <button class="btn btn-primary btn-xs"
              [routerLink]="[`/admin/usuarios/${usuario.userName}/edit`]">Editar</button>
          </th>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>
