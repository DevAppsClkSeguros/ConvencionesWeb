<div>
  <section class="flex flex-col md:flex-row items-center justify-between gap-4 p-4 ">
    <span class="text-center md:text-left w-full md:w-auto text-3xl">Módulos</span>
    <div class="flex flex-col sm:flex-row items-center justify-end gap-4 w-full md:w-auto">
      <a (click)="refrescaDatos()" class="btn btn-info">
        <shared-icon-refresh />
        Refrescar
      </a>
      <a routerLink="/admin/modulos/new" class="btn btn-primary">
        <shared-icon-add />
        Nuevo
      </a>
    </div>
  </section>
  <div class="overflow-x-auto">
    <table class="table md:ml-5 w-full min-w-full">
      <!-- head -->
      <thead>
        <tr>
          <th>Id</th>
          <th>Estatus</th>
          <th>Módulo</th>
          <th>Tipo de respuesta</th>
          <th>Descripción</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <!-- row 1 -->
        @for (modulo of modulosResource.value(); track modulo.id) {
        <tr>
          <td>{{modulo.id}}</td>
          <td>{{modulo.status === modulo.status ? 'Activo' : 'Inactivo'}}</td>
          <td>
            {{modulo.masterKey}}
            <br />
            <span class="badge badge-ghost badge-sm">{{modulo.keyCode}}</span>
          </td>
          <td>
            {{modulo.idTypeResp}}
          </td>
          <td>{{modulo.descripcion}}
          </td>
          <th>
            <button class="btn btn-primary btn-xs" [routerLink]="[`/admin/modulos/${modulo.keyCode}/edit`]">Editar</button>
          </th>
          <th>
            <button class="btn btn-secondary btn-xs" (click)="abrirModal(modulo.id)">Eliminar</button>
          </th>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>

<shared-confirm-modal #deleteModal titulo="¡Confirmar Eliminación!" mensajeAceptar="Si, Eliminar"
  mensaje="{{mensajeEliminar}}" (confirmar)="eliminaModulo()" (cancelar)="moduloId = 0" />
