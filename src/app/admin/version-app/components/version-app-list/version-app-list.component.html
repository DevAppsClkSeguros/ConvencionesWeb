<div>
  <section class="flex flex-col md:flex-row items-center justify-between gap-4 p-4">
    <span class="text-center md:text-left w-full md:w-auto text-3xl">Versiones App</span>
    <div class="flex flex-col sm:flex-row items-center justify-end gap-4 w-full md:w-auto">
      <a (click)="versionesResource.reload()" class="btn btn-info">
        <shared-icon-refresh />
        Refrescar
      </a>
    </div>
  </section>
  <div class="overflow-x-auto">
    <table class="table ml-5">
      <!-- head -->
      <thead>
        <tr>
          <th>Id</th>
          <th>Android</th>
          <th>IOS</th>
          <th>Huawei</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (version of versionesResource.value(); track version.id) {
        <tr>
          <td>{{version.id}}</td>
          <td>
            <div class="flex items-center gap-3">
              <div>
                <div class="font-bold">{{version.version_Android}}</div>
              </div>
            </div>
          </td>
          <td>
            <div class="flex items-center gap-3">
              <div>
                <div class="font-bold">{{version.version_IOs}}</div>
              </div>
            </div>
          </td>
          <td>
            <div class="flex items-center gap-3">
              <div>
                <div class="font-bold">{{version.version_Huawei}}</div>
              </div>
            </div>
          </td>
          <th>
            <button class="btn btn-primary btn-xs"
              [routerLink]="[`/admin/version-app/${version.id}/edit`]">Editar</button>
          </th>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>
